<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b2e">
<script src="/tema-janela.js"></script>
<script src="/atualizacao.js" defer></script>
<title>Ligações e acessórios — Metálica</title>
<link rel="stylesheet" href="/estilo.css">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('galpao.tema'); } catch (e) { t = null; }
  if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t);
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%230b3d91'/><rect x='7' y='8' width='18' height='16' rx='1.5' fill='none' stroke='%23fff' stroke-width='2'/><circle cx='12' cy='13' r='1.8' fill='%23fff'/><circle cx='20' cy='13' r='1.8' fill='%23fff'/><circle cx='12' cy='19' r='1.8' fill='%23fff'/><circle cx='20' cy='19' r='1.8' fill='%23fff'/></svg>">
<style>
  .ligacoes { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; max-width: 1500px; margin: 0 auto; padding: 16px 22px 60px; }
  @media (max-width: 960px) { .ligacoes { grid-template-columns: 1fr; } }
  .indice { position: sticky; top: 62px; align-self: start; max-height: calc(100vh - 80px); overflow: auto; background: var(--painel);
            border: 1px solid var(--borda); border-radius: var(--raio); padding: 10px 10px 14px; }
  .indice input[type=search] { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; padding: 6px 9px; margin-bottom: 8px;
            border: 1px solid var(--campo-borda); border-radius: var(--raio-p); background: var(--campo-fundo); color: var(--texto); }
  .indice h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--texto3); margin: 12px 4px 4px; }
  .indice button { display: flex; width: 100%; text-align: left; gap: 6px; align-items: baseline; font: inherit; font-size: 13px; padding: 5px 8px;
            border: 0; border-radius: var(--raio-p); background: none; color: var(--texto); cursor: pointer; }
  .indice button:hover { background: var(--azul-fraco); }
  .indice button.ativo { background: var(--azul); color: #fff; }
  .indice button .n { margin-left: auto; font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--painel2); color: var(--texto3); border: 1px solid var(--borda); }
  .indice button.ativo .n { background: rgba(255,255,255,.2); color: #fff; border-color: transparent; }
  .detalhe h2 { font-size: 21px; margin: 2px 0 4px; color: var(--texto); }
  .detalhe .desc { color: var(--texto2); margin: 0 0 8px; max-width: 980px; line-height: 1.45; }
  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .etiquetas span { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--borda); background: var(--painel2); color: var(--texto2); }
  .etiquetas span.sooro { border-color: var(--azul2); color: var(--azul); background: var(--azul-fraco); }
  .grade { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 14px; }
  @media (max-width: 1150px) { .grade { grid-template-columns: 1fr; } }
  .caixa { background: var(--painel); border: 1px solid var(--borda); border-radius: var(--raio); padding: 12px 14px; box-shadow: var(--sombra); }
  .caixa h3 { font-size: 13px; margin: 0 0 8px; color: var(--azul); text-transform: uppercase; letter-spacing: .04em; }
  .figura { min-height: 320px; display: flex; align-items: center; justify-content: center; background: var(--painel2); border-radius: var(--raio-p); padding: 8px; }
  .figura svg { width: 100%; height: auto; max-height: 520px; }
  .params { display: grid; grid-template-columns: minmax(130px, 1fr) minmax(110px, 150px); gap: 6px 10px; align-items: center; font-size: 13px; }
  .params label { color: var(--texto2); }
  .params input, .params select { font: inherit; font-size: 13px; padding: 4px 7px; border: 1px solid var(--campo-borda); border-radius: var(--raio-p);
            background: var(--campo-fundo); color: var(--texto); width: 100%; box-sizing: border-box; }
  .params .un { font-size: 11px; color: var(--texto3); }
  table.tab { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.tab th, table.tab td { border: 1px solid var(--borda); padding: 4px 7px; text-align: left; vertical-align: top; }
  table.tab th { background: var(--painel2); font-weight: 600; color: var(--texto); }
  table.tab td.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.tab tfoot td { font-weight: 600; background: var(--painel2); }
  .notas { margin: 8px 0 0; padding-left: 18px; color: var(--texto2); font-size: 12.5px; }
  .notas li { margin: 3px 0; }
  .resumo-verif { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0; }
  .selo { display: inline-block; padding: 2px 10px; border-radius: 3px; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
  .selo.ok { background: var(--verde-fundo); color: var(--verde); border: 1px solid var(--verde); }
  .selo.nao { background: var(--verm-fundo); color: var(--verm); border: 1px solid var(--verm); }
  .barra-ap { flex: 1; min-width: 180px; height: 10px; background: var(--painel2); border: 1px solid var(--borda); border-radius: 999px; position: relative; }
  .barra-ap i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--verde-barra); }
  .barra-ap.reprova i { background: var(--verm); }
  .barra-ap .lim { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--texto); }
  .esforcos { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; font-size: 13px; margin-bottom: 8px; }
  .esforcos label { display: grid; gap: 3px; color: var(--texto2); }
  .esforcos input { font: inherit; font-size: 13px; padding: 4px 7px; width: 110px; border: 1px solid var(--campo-borda); border-radius: var(--raio-p); background: var(--campo-fundo); color: var(--texto); }
  /* contas: o mesmo desenho do memorial */
  .contas .verif { border: 1px solid var(--borda); border-left: 5px solid var(--azul2); border-radius: var(--raio-p); margin: 0 0 10px; }
  .contas .verif > .cab { display: flex; align-items: baseline; gap: 10px; padding: 6px 10px; background: var(--azul-fraco); border-bottom: 1px solid var(--borda); }
  .contas .verif > .cab .t { font-weight: 600; color: var(--azul-tinta); flex: 1; }
  .contas .verif > .cab .n { font-size: 11.5px; color: var(--texto3); }
  /* .corpo é também o layout de duas colunas de estilo.css (altura mínima de uma tela): aqui é só o miolo */
  .contas .corpo { display: block; min-height: 0; }
  .contas .verif > .corpo { display: block; padding: 6px 10px 8px; font-size: 12.5px; }
  .contas .verif.reprova { border-left-color: var(--verm); }
  .contas .verif.reprova > .cab { background: var(--verm-fundo); }
  .contas table.passos { border-collapse: collapse; width: 100%; font-size: 12px; }
  .contas table.passos th, .contas table.passos td { border: 1px solid var(--borda); padding: 3px 6px; text-align: left; vertical-align: top; }
  .contas table.passos th { background: var(--painel2); color: var(--texto); font-weight: 600; }
  .contas table.passos td.val { font-weight: 600; white-space: nowrap; }
  .contas table.passos td.nrm { color: var(--texto3); white-space: nowrap; }
  .contas .dica { font-size: 11px; color: var(--texto2); font-style: italic; }
  .contas .resultado { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 0; }
  .contas .resultado .c { flex: 1 1 0; min-width: 100px; border: 1px solid var(--borda); border-radius: var(--raio-p); padding: 4px 8px; text-align: center; background: var(--painel2); }
  .contas .resultado .c .k { font-size: 10px; color: var(--texto3); text-transform: uppercase; }
  .contas .resultado .c .v { font-size: 15px; font-weight: 650; color: var(--azul-tinta); }
  .contas .resultado .c .u { font-size: 10px; color: var(--texto3); }
  .contas .barra { height: 8px; background: var(--painel2); border: 1px solid var(--borda); border-radius: 999px; position: relative; margin: 6px 0 2px; }
  .contas .barra i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--verde-barra); border-radius: 999px; }
  .contas .barra.reprova i { background: var(--verm); }
  .contas .barra .lim { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--texto); }
  .contas .pequeno { font-size: 11px; color: var(--texto3); }
  .contas .obs { font-size: 12px; color: var(--texto2); margin: 4px 0 0; }
  .contas details.explica { margin: 6px 0 0; border: 1px dashed var(--borda-forte); border-radius: var(--raio-p); background: var(--painel2); font-size: 12.5px; }
  .contas details.explica summary { cursor: pointer; padding: 4px 10px; color: var(--azul2); font-weight: 600; font-size: 12px; }
  .contas details.explica .corpo { padding: 0 10px 6px; }
  .contas .lacuna { color: var(--texto3); }
  .contas .selo { font-size: 10.5px; }
  .vazio { color: var(--texto3); font-size: 13px; padding: 10px 0; }
  .aviso-topo { padding: 10px 14px; border-left: 3px solid var(--verm); background: var(--verm-fundo); border-radius: var(--raio-p); margin: 0 0 12px; font-size: 13.5px; }
  /* desenho: as cores vêm do tema */
  svg.ligacao * { vector-effect: non-scaling-stroke; }
  svg.ligacao .aco { fill: color-mix(in srgb, var(--azul) 14%, transparent); stroke: var(--azul); stroke-width: 1.4; }
  svg.ligacao .aco2 { fill: color-mix(in srgb, #d4a017 22%, transparent); stroke: #b8860b; stroke-width: 1.2; }
  svg.ligacao .furo { fill: var(--painel); stroke: var(--verm); stroke-width: 1.2; }
  svg.ligacao .eixo { stroke: var(--verm); stroke-width: .8; stroke-dasharray: 10 3 2 3; fill: none; }
  svg.ligacao .cota { stroke: var(--verde); stroke-width: .8; fill: none; }
  svg.ligacao .seta { fill: var(--verde); stroke: none; }
  svg.ligacao .cotatx { fill: var(--verde); font-family: Arial, sans-serif; dominant-baseline: text-after-edge; }
  svg.ligacao .solda { fill: #e67e22; stroke: none; }
  svg.ligacao .oculta { fill: none; stroke: var(--texto3); stroke-width: 1; stroke-dasharray: 6 4; }
  svg.ligacao .rosca { fill: color-mix(in srgb, var(--texto3) 30%, transparent); stroke: var(--texto2); stroke-width: 1; }
  svg.ligacao .barra { stroke: var(--azul); stroke-width: 3; fill: none; }
  svg.ligacao .concreto { stroke: var(--texto3); stroke-width: 1.2; stroke-dasharray: 3 3; }
  svg.ligacao .rot { fill: var(--texto2); font-family: Arial, sans-serif; }
  svg.ligacao .tit { fill: var(--texto); font-family: Arial, sans-serif; font-weight: 700; }
</style>
</head>
<body>

<header class="topo">
  <div class="marca">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="7" width="20" height="18" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="1.8" fill="currentColor"/><circle cx="20" cy="13" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/><circle cx="20" cy="19" r="1.8" fill="currentColor"/></svg>
    <h1>Ligações e acessórios<span>biblioteca</span></h1>
  </div>
  <div class="acoes">
    <button type="button" id="btn-voltar" title="Volta para a tela anterior">&larr; Voltar</button>
    <button type="button" id="btn-tema" title="Alternar tema claro/escuro">Tema</button>
    <button type="button" onclick="location.href='/'" title="Voltar à lista de projetos">Projetos</button>
  </div>
</header>

<main class="ligacoes">
  <nav class="indice" id="indice" aria-label="Tipos de ligação">
    <input type="search" id="busca" placeholder="Procurar: terça, chumbador, castanha…" aria-label="Procurar ligação">
    <div id="lista"></div>
  </nav>
  <section class="detalhe" id="detalhe"><p class="vazio">Carregando a biblioteca…</p></section>
</main>

<script src="/ligacoes.js"></script>
<script src="/versao.js" defer></script>
<script src="/vivo.js"></script>
</body>
</html>

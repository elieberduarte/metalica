<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b2e">
<script src="/tema-janela.js"></script>
<script src="/atualizacao.js" defer></script>
<title>Editor 3D — estruturas metálicas</title>
<link rel="stylesheet" href="/editor3d/editor.css">
<script>
// Tema antes do primeiro quadro. O editor.js só roda depois de baixar o three.js;
// sem isto, num sistema em modo escuro a página pinta escura até lá. O parâmetro
// ?tema= vale mais que o tema salvo pela interface (galpao.tema).
(function () {
  var t = new URLSearchParams(location.search).get('tema');
  if (t !== 'claro' && t !== 'escuro') { try { t = localStorage.getItem('galpao.tema'); } catch (e) { t = null; } }
  if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t);
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%230b3d91'/><path d='M6 21V11l10-5 10 5v10l-10 5z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/><path d='M6 11l10 5 10-5M16 16v10' fill='none' stroke='%23fff' stroke-width='1.2' opacity='.65'/></svg>">

<script type="importmap">
{
  "imports": {
    "three": "../lib/three.module.js",
    "three/addons/": "../lib/"
  }
}
</script>
<script>
// Registra erros desde antes dos módulos carregarem (inclusive falha de import),
// para que a verificação automática consiga ler a lista em body[data-erros].
window.__errosEditor = [];
(function () {
  var guardar = function (t) { window.__errosEditor.push(String(t).slice(0, 400)); };
  addEventListener('error', function (e) {
    var alvo = e.target && e.target !== window ? (e.target.src || e.target.href || '') : '';
    guardar(alvo ? 'recurso não carregou: ' + alvo : (e.message || 'erro') +
            (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
  }, true);
  addEventListener('unhandledrejection', function (e) {
    guardar('promessa rejeitada: ' + (e.reason && e.reason.message || e.reason));
  });
  var original = console.error;
  console.error = function () {
    guardar('console.error: ' + Array.prototype.map.call(arguments, String).join(' '));
    return original.apply(console, arguments);
  };
})();
</script>
</head>
<body>

<header class="topo">
  <div class="marca">
    <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M6 21V11l10-5 10 5v10l-10 5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M6 11l10 5 10-5M16 16v10" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".6"/>
    </svg>
    <span>Editor 3D</span>
  </div>
  <a class="voltar" id="link-projetos" href="/" title="Voltar à lista de projetos">&larr; Projetos</a>
  <a class="voltar" id="link-desenho" href="/cad" hidden title="Voltar ao desenho 2D do projeto">&larr; Desenho 2D</a>
  <a class="voltar" id="link-dimensionamento" href="/dimensionar" title="Ir para o dimensionamento deste projeto">Dimensionamento</a>

  <div class="menus" id="menus">
    <div class="menu" data-menu="arquivo">
      <button type="button" class="menu-botao">Arquivo</button>
      <div class="menu-lista">
        <button type="button" data-acao="novo">Novo modelo</button>
        <button type="button" data-acao="abrir">Abrir…</button>
        <button type="button" data-acao="salvar">Salvar</button>
        <button type="button" data-acao="salvar-como">Salvar como…</button>
        <hr>
        <button type="button" data-acao="exemplo">Modelo de exemplo</button>
        <button type="button" data-acao="do-galpao">Gerar do galpão dimensionado…</button>
      </div>
    </div>
    <div class="menu" data-menu="ifc">
      <button type="button" class="menu-botao">IFC</button>
      <div class="menu-lista">
        <button type="button" data-acao="importar-ifc">Importar IFC…</button>
        <button type="button" data-acao="inspecionar-ifc">Inspecionar IFC…</button>
        <button type="button" data-acao="detalhar-ifc"
                title="Lê um IFC de detalhamento (TecnoMETAL, Tekla…) e gera o DXF de produção com todas as peças, o romaneio e o relatório">Detalhar peças de um IFC…</button>
        <hr>
        <button type="button" data-acao="exportar-ifc">Exportar IFC</button>
        <button type="button" data-acao="restaurar-modelo" title="Voltar o modelo do projeto a uma gravação anterior (histórico)">Restaurar modelo anterior…</button>
      </div>
    </div>
    <div class="menu" data-menu="desenho2d">
      <button type="button" class="menu-botao">Detalhamentos</button>
      <div class="menu-lista">
        <button type="button" data-acao="desenho-corte" title="Usa o plano da ferramenta Seção (X)">Gerar desenho do corte atual <kbd>G</kbd></button>
        <button type="button" data-acao="desenho-selecao">Vistas da seleção…</button>
        <button type="button" data-acao="detalhar-pecas" title="Uma célula por posição (peças iguais contadas) e a elevação de cada conjunto, com cotas de fabricação e romaneio">Detalhar peças e conjuntos…</button>
        <button type="button" data-acao="eixos-obra" title="Eixos numerados (tesouras) e com letra (apoios) identificados do modelo; renomeie, mova, acrescente — as plantas de localização e de chumbação usam os eixos gravados">Eixos da obra…</button>
        <button type="button" data-acao="cantos-redondos" title="Barras calandradas do modelo (o joelho da tesoura): raio, ângulo e em quantas retas quebrar; a quebra vai para o 3D em todas as instâncias">Cantos redondos…</button>
        <hr>
        <button type="button" data-acao="abrir-cad" title="Abre no CAD o detalhamento completo do projeto (tudo num desenho só); sem ele, o CAD vazio">Abrir o CAD 2D do projeto</button>
        <button type="button" data-acao="materiais" title="Romaneio por posição, resumo por perfil com barras comerciais, chapas por espessura, conjuntos e acessórios; CSV para o Excel e PDF">Lista de materiais…</button>
        <button type="button" data-acao="excluir-desenhos" title="Manda desenhos do projeto (detalhamentos, cortes, pranchas) para a lixeira, para gerar de novo">Excluir desenhos…</button>
      </div>
    </div>
    <div class="menu" data-menu="editar">
      <button type="button" class="menu-botao">Editar</button>
      <div class="menu-lista" id="menu-editar">
        <button type="button" data-acao="desfazer">Desfazer</button>
        <button type="button" data-acao="refazer">Refazer</button>
        <hr>
        <button type="button" data-acao="selecionar-tudo">Selecionar tudo</button>
        <button type="button" data-acao="inverter-selecao">Inverter seleção</button>
        <button type="button" data-acao="apagar">Apagar seleção</button>
        <hr>
        <div class="menu-titulo">Histórico</div>
        <div id="historico-undo" class="historico"></div>
      </div>
    </div>
    <div class="menu" data-menu="ver">
      <button type="button" class="menu-botao">Ver</button>
      <div class="menu-lista">
        <div class="menu-titulo">Vistas padrão</div>
        <button type="button" data-vista="topo">Topo <kbd>1</kbd></button>
        <button type="button" data-vista="frente">Frente <kbd>2</kbd></button>
        <button type="button" data-vista="tras">Trás <kbd>3</kbd></button>
        <button type="button" data-vista="esquerda">Esquerda <kbd>4</kbd></button>
        <button type="button" data-vista="direita">Direita <kbd>5</kbd></button>
        <button type="button" data-vista="inferior">Inferior <kbd>6</kbd></button>
        <button type="button" data-vista="isometrica">Isométrica <kbd>7</kbd></button>
        <hr>
        <button type="button" data-acao="zoom-extensao">Zoom na extensão <kbd>Z</kbd></button>
        <button type="button" data-acao="zoom-selecao">Zoom na seleção</button>
        <button type="button" data-acao="isolar" title="Mostra só a seleção para editar; clique de novo (ou em Voltar ao modelo) para trazer o resto">Isolar seleção / voltar ao modelo</button>
        <hr>
        <button type="button" data-acao="desempenho">Diagnóstico de desempenho…</button>
        <button type="button" data-acao="sombras" id="menu-sombras" title="Modelo com mais de 1.500 peças abre sem sombra, para a navegação ficar leve">Sombras</button>
        <hr>
        <button type="button" data-acao="mapa-esforcos" id="menu-calcular">Calcular estrutura <kbd>F9</kbd></button>
        <button type="button" data-acao="resultado-analise" title="O último cálculo numa tela: resumo, situação por tipo, todas as peças com a conta de cada verificação, ligações, cargas e vento; dá para imprimir">Resultado da análise…</button>
        <button type="button" data-acao="dimensionar" id="menu-dimensionar" title="Escolhe, em cada posição, o perfil mais leve do catálogo que passa no cálculo e troca no modelo (o anterior vai para o histórico)">Dimensionar: o perfil mais leve que passa…</button>
        <hr>
        <a class="menu-link" href="/ajuda" target="_blank" rel="noopener">Ajuda do programa…</a>
      </div>
    </div>
  </div>

  <div class="nome-modelo">
    <input id="nome-modelo" value="Modelo" spellcheck="false" aria-label="Nome do modelo">
  </div>

  <div class="busca-pecas" id="busca-pecas">
    <input id="busca-campo" type="search" placeholder="Pesquisar peça: nome, posição, conjunto, perfil…  (Ctrl+F)"
           spellcheck="false" autocomplete="off" aria-label="Pesquisar peças">
    <div class="busca-resultados" id="busca-resultados" hidden></div>
  </div>

  <div class="topo-acoes">
    <button type="button" id="btn-calcular" class="botao destaque" aria-pressed="false"
            title="Calcula os esforços do galpão dimensionado e pinta o mapa (F9)">Calcular estrutura</button>
    <div class="segmentado" id="modos-exibicao" role="group" aria-label="Modo de exibição"></div>
    <button type="button" id="btn-projecao" class="botao" title="Alternar perspectiva / ortográfica">Perspectiva</button>
    <button type="button" id="btn-tema" class="botao" title="Alternar tema claro/escuro">Tema</button>
  </div>
</header>

<div class="area">

  <nav class="ferramentas" id="barra-ferramentas" aria-label="Ferramentas"></nav>

  <div class="palco" id="palco">
    <canvas id="canvas3d"></canvas>
    <svg id="camada-snap" class="camada-snap" aria-hidden="true"></svg>
    <div id="retangulo-selecao" class="retangulo-selecao" hidden></div>

    <div class="vistas-rapidas" id="vistas-rapidas"></div>

    <div class="carimbo" id="carimbo">
      <span id="carimbo-contagem">0 objetos</span>
      <span id="carimbo-extensao">—</span>
    </div>

    <div class="avisos" id="avisos" aria-live="polite"></div>
  </div>

  <aside class="paineis" id="paineis" aria-label="Painéis">

    <section class="painel" data-painel="propriedades">
      <h2><button type="button" class="cabecalho">Propriedades</button></h2>
      <div class="corpo" id="painel-propriedades"></div>
    </section>

    <section class="painel" data-painel="camadas">
      <h2><button type="button" class="cabecalho">Camadas</button></h2>
      <div class="corpo" id="painel-camadas"></div>
    </section>

    <section class="painel" data-painel="materiais">
      <h2><button type="button" class="cabecalho">Materiais</button></h2>
      <div class="corpo" id="painel-materiais"></div>
    </section>

    <!-- Só aparece depois de "Calcular estrutura": sem análise não há o que mostrar. -->
    <section class="painel" data-painel="analise" hidden>
      <h2><button type="button" class="cabecalho">Análise</button></h2>
      <div class="corpo" id="painel-analise"></div>
    </section>

    <section class="painel cresce" data-painel="arvore">
      <h2><button type="button" class="cabecalho">Árvore do modelo</button></h2>
      <div class="corpo" id="painel-arvore"></div>
    </section>

  </aside>
</div>

<footer class="rodape">
  <span class="dica" id="dica">Carregando…</span>
  <span class="trava" id="trava"></span>
  <span class="espaco"></span>
  <span class="estado-servidor" id="estado-servidor"></span>
  <span class="estado-servidor" id="versao-programa" title="Versão do programa nesta janela"></span>
  <label class="caixa-medidas">
    <span>Medidas</span>
    <input id="medida" type="text" spellcheck="false" autocomplete="off"
           placeholder="—" aria-label="Caixa de medidas">
  </label>
</footer>

<dialog id="dialogo">
  <form method="dialog" id="dialogo-form">
    <h3 id="dialogo-titulo">—</h3>
    <div id="dialogo-corpo"></div>
    <!-- Confirmar vem antes no DOM: é o botão que o Enter aciona. O CSS inverte a ordem. -->
    <menu>
      <button type="submit" value="ok" class="botao principal" id="dialogo-ok">Confirmar</button>
      <button type="submit" value="cancelar" class="botao" id="dialogo-cancelar">Cancelar</button>
    </menu>
  </form>
</dialog>

<input type="file" id="arquivo-ifc" accept=".ifc,.IFC" hidden>

<script type="module" src="/editor3d/editor.js"></script>
<script src="/vivo.js"></script>
<script src="/versao.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b2e">
<script src="/tema-janela.js"></script>
<script src="/atualizacao.js" defer></script>
<title>Comercial — Metálica</title>
<link rel="stylesheet" href="/estilo.css">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('galpao.tema'); } catch (e) { t = null; }
  if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t);
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%2335434C'/><path d='M9 22l5-12h4l-5 12zM16 22l5-12h3l-5 12z' fill='%23C3D773'/></svg>">
<style>
  .comercial { max-width: 1320px; margin: 0 auto; padding: 18px 24px 70px; }
  .obra { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px; margin: 4px 0 14px; }
  .obra .titulo { flex: 1; min-width: 260px; }
  .obra .titulo h2 { margin: 0; font-size: 22px; font-weight: 650; color: var(--texto); }
  .obra .titulo p { margin: 3px 0 0; font-size: 13px; color: var(--texto2); }
  .botao-m { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--borda-forte); border-radius: var(--raio-p);
             background: var(--painel); color: var(--texto); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .botao-m:hover { border-color: var(--azul2); color: var(--azul2); }
  .botao-m.principal { background: var(--azul); border-color: var(--azul); color: #fff; }
  .botao-m.principal:hover { background: var(--azul2); color: #fff; }
  .botao-m:disabled { opacity: .55; cursor: default; }
  .botao-m.perigo:hover { border-color: var(--verm); color: var(--verm); }
  .abas { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--borda); margin: 0 0 16px; position: sticky; top: 52px; z-index: 5; background: var(--fundo); padding-top: 4px; }
  .abas button { font: inherit; font-size: 14px; padding: 8px 16px 9px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--texto2); cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
  .abas button.ativa { color: var(--azul); border-bottom-color: var(--azul); font-weight: 600; }
  .abas .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--borda-forte); }
  .abas .ponto.ok { background: var(--verde); } .abas .ponto.meio { background: var(--amarelo); }
  .abas .sep { flex: 1; }
  .painel-aba[hidden] { display: none; }
  .barra { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 14px; }
  .barra .sep { flex: 1; } .barra .estado { font-size: 12.5px; color: var(--texto3); }
  .grade2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, .9fr); gap: 16px; align-items: start; }
  @media (max-width: 1050px) { .grade2 { grid-template-columns: 1fr; } }
  .caixa { background: var(--painel); border: 1px solid var(--borda); border-radius: var(--raio); padding: 14px 16px; box-shadow: var(--sombra); margin-bottom: 14px; }
  .caixa h3 { margin: 0 0 10px; font-size: 15px; color: var(--azul); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .caixa h3 small { font-size: 12px; font-weight: 400; color: var(--texto3); }
  .campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .campos label, .campo { display: grid; gap: 4px; font-size: 12.5px; color: var(--texto2); }
  .campos label.largo { grid-column: 1 / -1; }
  input[type=text], input[type=number], input[type=date], select, textarea {
    font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid var(--campo-borda); border-radius: var(--raio-p); background: var(--campo-fundo); color: var(--texto); width: 100%; box-sizing: border-box; }
  textarea { min-height: 70px; resize: vertical; line-height: 1.45; }
  textarea.alta { min-height: 170px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--campo-foco); outline-offset: -1px; }
  .linhas { display: grid; gap: 6px; }
  .linha { display: grid; gap: 6px; align-items: center; }
  .linha .x { border: 0; background: none; color: var(--texto3); cursor: pointer; font-size: 16px; padding: 0 4px; }
  .linha .x:hover { color: var(--verm); }
  .geo .linha { grid-template-columns: 2fr 1fr 1fr 1fr 24px; }
  .car .linha { grid-template-columns: 1fr 2fr 24px; }
  .din .linha { grid-template-columns: 3fr 1fr 24px; }
  .parc .linha { grid-template-columns: 1.5fr 1fr 1fr 70px 1fr 24px; }
  .cab-linha { font-size: 11.5px; color: var(--texto3); text-transform: uppercase; letter-spacing: .05em; }
  .bloco-escopo { border: 1px solid var(--borda); border-radius: var(--raio-p); padding: 10px; margin-bottom: 10px; background: var(--painel2); }
  .bloco-escopo .topo-bloco { display: flex; gap: 8px; margin-bottom: 8px; }
  .item-escopo { display: grid; grid-template-columns: 22px 1fr auto 24px; gap: 6px; align-items: center; margin-bottom: 4px; }
  .item-escopo .mover { cursor: grab; color: var(--texto3); text-align: center; user-select: none; }
  .item-escopo label { font-size: 11.5px; color: var(--texto3); display: inline-flex; gap: 3px; align-items: center; white-space: nowrap; }
  .avisos { margin: 0; padding-left: 18px; font-size: 13px; color: var(--amarelo); }
  .avisos li { margin: 3px 0; }
  .ok-msg { font-size: 13px; color: var(--verde); }
  .imagens { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .imagens figure { margin: 0; border: 1px solid var(--borda); border-radius: var(--raio-p); overflow: hidden; background: #fff; }
  .imagens figure.fora { opacity: .4; }
  .imagens img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; }
  .imagens figcaption { padding: 6px; display: grid; gap: 4px; background: var(--painel); }
  .imagens figcaption label { font-size: 12px; color: var(--texto2); display: flex; gap: 5px; align-items: center; }
  .previa { min-height: 75vh; display: flex; flex-direction: column; }
  .previa iframe { flex: 1; width: 100%; min-height: 72vh; border: 1px solid var(--borda); border-radius: var(--raio); background: #fff; }
  .vazio { padding: 18px; color: var(--texto3); font-size: 13.5px; border: 1px dashed var(--borda-forte); border-radius: var(--raio); text-align: center; background: var(--painel); }
  .valor-grande { font-size: 26px; font-weight: 300; color: var(--texto); font-variant-numeric: tabular-nums; }
  .cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 0 0 14px; }
  .cartao-n { padding: 11px 14px 10px; background: var(--painel); border: 1px solid var(--borda); border-radius: var(--raio); box-shadow: var(--sombra); }
  .cartao-n b { display: block; font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .cartao-n span { font-size: 11.5px; color: var(--texto2); text-transform: uppercase; letter-spacing: .05em; }
  .cartao-n small { display: block; font-size: 12px; color: var(--texto3); margin-top: 2px; }
  .cartao-n.ruim b { color: var(--verm); } .cartao-n.bom b { color: var(--verde); }
  .barra-prog { height: 8px; background: var(--painel2); border: 1px solid var(--borda); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .barra-prog i { display: block; height: 100%; background: var(--verde); }
  .tempo { display: grid; gap: 8px; }
  .etapa { display: grid; grid-template-columns: 30px minmax(140px, 1fr) 128px 104px 104px; gap: 6px 8px; align-items: center;
           padding: 8px 10px; border: 1px solid var(--borda); border-radius: var(--raio-p); background: var(--painel); }
  .etapa .extra { grid-column: 2 / -1; display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
  @media (max-width: 760px) { .etapa { grid-template-columns: 30px 1fr 128px; } .etapa .opc { grid-column: 2 / -1; } }
  .adit .linha { grid-template-columns: 110px 3fr 1fr 90px 24px; }
  .parc3 .linha { grid-template-columns: 2fr 1fr 1fr 24px; }
  .etapa .bola { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--borda-forte); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--texto3); }
  .etapa.concluida .bola { background: var(--verde); border-color: var(--verde); color: #fff; }
  .etapa.andamento .bola { border-color: var(--azul2); color: var(--azul2); }
  .etapa .nome b { display: block; font-size: 13.5px; } .etapa .nome small { color: var(--texto3); font-size: 11.5px; }
  .etapa .auto { font-size: 11px; color: var(--texto3); }
  table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.t th, table.t td { border-bottom: 1px solid var(--borda); padding: 6px 8px; text-align: left; vertical-align: middle; }
  table.t th { font-size: 11.5px; color: var(--texto3); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  table.t td.r, table.t th.r { text-align: right; font-variant-numeric: tabular-nums; }
  table.t tr.atrasada td { color: var(--verm); } table.t tr.paga td { color: var(--texto3); }
  .hist { font-size: 12.5px; color: var(--texto2); margin: 0; padding-left: 16px; max-height: 260px; overflow: auto; }
  .aviso-topo { padding: 10px 14px; border-left: 3px solid var(--amarelo); background: var(--amarelo-fundo); border-radius: var(--raio-p); margin: 0 0 14px; font-size: 13.5px; }
  .aviso-topo.erro { border-color: var(--verm); background: var(--verm-fundo); } .aviso-topo.ok { border-color: var(--verde); background: var(--verde-fundo); }
  .giro { width: 14px; height: 14px; border: 2px solid var(--borda-forte); border-top-color: var(--azul2); border-radius: 50%; animation: giro .8s linear infinite; display: inline-block; vertical-align: -2px; }
  @keyframes giro { to { transform: rotate(360deg); } }
  .dica { font-size: 12px; color: var(--texto3); margin: 6px 0 0; }
  .marca-prev { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .marca-prev img { height: 34px; background: #fff; padding: 4px; border: 1px solid var(--borda); border-radius: 4px; }
  .marca-prev img.claro { background: #35434C; }
</style>
</head>
<body>
<header class="topo">
  <div class="marca">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 23l5-14h4l-5 14zM17 23l5-14h3l-5 14z" fill="currentColor"/></svg>
    <h1>Comercial<span id="sub-projeto">projeto</span></h1>
  </div>
  <div class="projeto-atual" id="quando">—</div>
  <div class="acoes">
    <button type="button" id="btn-voltar">&larr; Voltar</button>
    <button type="button" id="btn-tema" title="Alternar tema claro/escuro">Tema</button>
    <button type="button" id="btn-materiais" title="Lista de materiais e orçamento">Orçamento</button>
    <button type="button" id="btn-3d" title="Modelo 3D deste projeto">Modelo 3D</button>
    <button type="button" onclick="location.href='/'" title="Voltar à lista de projetos">Projetos</button>
  </div>
</header>
<main class="comercial">
  <div id="aviso" class="aviso-topo" hidden></div>
  <section class="obra">
    <div class="titulo"><h2 id="obra-nome">—</h2><p id="obra-sub">—</p></div>
  </section>
  <nav class="abas" id="abas"></nav>
  <div id="conteudo"></div>
</main>
<script src="/comercial.js"></script>
<script src="/versao.js" defer></script>
<script src="/etapas.js"></script>
<script src="/vivo.js"></script>
</body>
</html>

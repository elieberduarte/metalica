<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b2e">
<script src="/tema-janela.js"></script>
<script src="/atualizacao.js" defer></script>
<title>Projeto — Metálica</title>
<link rel="stylesheet" href="/estilo.css">
<link rel="stylesheet" href="/editor3d/editor.css">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('galpao.tema'); } catch (e) { t = null; }
  if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t);
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%230b3d91'/><rect x='5' y='7' width='10' height='18' fill='none' stroke='%23fff' stroke-width='2'/><path d='M19 12 L24 9 L29 12 L29 22 L24 25 L19 22 Z' fill='none' stroke='%23fff' stroke-width='2'/></svg>">
<style>
  html, body { height: 100%; }
  .area-topo { min-height: 40px; height: 40px; padding: 0 10px; gap: 12px; }
  .area-topo .marca { gap: 8px; min-width: 0; }
  .area-topo .marca .nome { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34vw; }
  .area-topo .vistas { display: inline-flex; flex-shrink: 0; }
  .area-topo .vistas button { border-radius: 0; padding: 4px 14px; font-size: 13px; border: 1px solid rgba(255,255,255,.22); background: transparent; color: #e2e8f0; }
  .area-topo .vistas button + button { border-left: 0; }
  .area-topo .vistas button:first-child { border-radius: 5px 0 0 5px; }
  .area-topo .vistas button:last-child { border-radius: 0 5px 5px 0; }
  .area-topo .vistas button.ativo { background: #fff; border-color: #fff; color: #0b3d91; font-weight: 700; }
  .area-topo { align-items: center; gap: 6px; padding: 0 8px; }
  .area-topo .marca { padding: 0 4px 0 2px; flex-shrink: 1; }
  .area-topo .menus { align-self: stretch; }
  .area-topo .rapidos { display: flex; align-items: center; gap: 6px; flex-shrink: 1; min-width: 0; }
  /* a barra é a mesma nas três vistas: a ligação 2D + 3D fica no menu Ver (os controles, escondidos, continuam
     aqui para o dividida.js) */
  .area-topo .so-ambos { display: none !important; }
  .area-topo { flex-wrap: nowrap; overflow: visible; }
  .area-topo .setas-desfazer { display: inline-flex; align-items: center; gap: 2px; margin: 0 4px 0 6px; }
  .area-topo .setas-desfazer button { background: transparent; color: #e2e8f0; border: 1px solid rgba(255,255,255,.22); border-radius: 5px;
                                      cursor: pointer; font-size: 15px; line-height: 1; padding: 3px 7px; }
  .area-topo .setas-desfazer button:hover { background: rgba(255,255,255,.12); }
  .menu-lista button.marcavel { white-space: pre; }
  .menu-lista .menu-titulo { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--texto3); padding: 6px 9px 2px; }
  .area-topo .controles { gap: 6px; }
  .area-topo .controles button, .area-topo .acoes button { background: transparent; color: #e2e8f0; border: 1px solid rgba(255,255,255,.22);
                                                             border-radius: 5px; cursor: pointer; }
  .area-topo .controles button:hover, .area-topo .acoes button:hover { background: rgba(255,255,255,.12); }
  .area-topo .acoes { display: flex; gap: 6px; flex-shrink: 0; }
  .area-topo .casa { font-size: 16px; padding: 1px 9px !important; }
  .menu-lista .secao-lado { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--texto3); padding: 6px 9px 2px; }
  .menu-lista .secao-lado + * { margin-top: 0; }
  html.topo-c1 .area-topo .marca .nome { display: none; }
  html.topo-c2 .area-topo .com-2d select { max-width: 120px; }
  html.topo-c3 #btn-paineis { display: none; }
  .area-topo .controles { flex-wrap: nowrap; overflow: hidden; }
  .area-topo .acoes { margin-left: auto; }
  .area-topo .acoes button, .area-topo #btn-trocar { padding: 4px 10px; font-size: 12.5px; white-space: nowrap; }
  /* a barra única da área de trabalho (web/barra_unica.js): os menus do 2D e do 3D juntos, fixos nas
     três vistas; as barras das telas de dentro ficam escondidas (html.barra-unica, web/area.js) */
  body:not(.v-ambos) .so-ambos { display: none !important; }
  body.v-2d #lado-3d, body.v-2d #divisor { display: none; }
  body.v-3d #lado-2d, body.v-3d #divisor { display: none; }
  body.v-2d #lado-2d, body.v-3d #lado-3d { flex: 1 1 auto !important; }
  body { display: flex; flex-direction: column; overflow: hidden; margin: 0; }
  .topo .controles { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  .topo .controles label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
  .topo .controles select { font: inherit; font-size: 12.5px; padding: 4px 8px; border-radius: 5px; cursor: pointer; color-scheme: dark;
                            border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06); color: #e2e8f0; max-width: 260px; }
  .topo .controles select:hover { border-color: rgba(255,255,255,.4); }
  .topo .controles select:focus { outline: 2px solid var(--azul2); outline-offset: 1px; }
  .topo .controles select option { background: #16202e; color: #e2e8f0; }
  .topo .grupo-modo { display: inline-flex; border: 1px solid rgba(255,255,255,.22); border-radius: 5px; overflow: hidden; }
  .topo .grupo-modo button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 12.5px; }
  .topo .grupo-modo button.ativo { background: var(--azul); color: #fff; }
  .quadro { flex: 1; display: flex; min-height: 0; position: relative; }
  .quadro.trocado { flex-direction: row-reverse; }
  .lado { position: relative; min-width: 200px; display: flex; flex-direction: column; }
  .lado iframe { flex: 1; border: 0; width: 100%; height: 100%; background: var(--fundo); }
  .lado .rotulo { position: absolute; left: 50%; transform: translateX(-50%); bottom: 6px; z-index: 2; pointer-events: none;
                  font-size: 11px; padding: 2px 10px; border-radius: 999px; background: rgba(15,23,42,.72); color: #e2e8f0; }
  .divisor { flex: 0 0 7px; cursor: col-resize; background: var(--borda); position: relative; }
  .divisor:hover, .divisor.arrastando { background: var(--azul); }
  .divisor::after { content: ''; position: absolute; top: 50%; left: 2px; width: 3px; height: 34px; margin-top: -17px;
                    border-left: 1px solid rgba(255,255,255,.55); border-right: 1px solid rgba(255,255,255,.55); }
  .arrastando iframe { pointer-events: none; }
  .aviso-dividida { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 5; max-width: 70%;
                    padding: 7px 14px; border-radius: 6px; font-size: 13px; background: #d97706; color: #fff; box-shadow: var(--sombra); }
  .aviso-dividida[hidden] { display: none; }
</style>
</head>
<body>

<header class="topo area-topo">
  <div class="marca">
    <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="7" width="10" height="18" fill="none" stroke="currentColor" stroke-width="2"/><path d="M18 12 L23 9 L28 12 L28 22 L23 25 L18 22 Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    <span class="nome" id="nome-projeto" title="Projeto">projeto</span>
  </div>
  <nav class="vistas" role="group" aria-label="Vista do projeto">
    <button type="button" data-vista="2d" title="O desenho do projeto (a troca não recarrega nada)">2D</button>
    <button type="button" data-vista="3d" title="O modelo 3D do projeto (a troca não recarrega nada)">3D</button>
    <button type="button" data-vista="ambos" title="O desenho e o modelo lado a lado: escolher uma peça num mostra ela no outro">2D + 3D</button>
  </nav>
  <div class="controles">
    <label class="so-ambos" title="Seguir a seleção: escolher uma peça num lado mostra ela no outro"><input type="checkbox" id="seguir" checked> 🔗</label>
    <span class="grupo-modo so-ambos" role="group" aria-label="O que o 2D mostra quando se escolhe uma treliça no 3D">
      <button type="button" data-modo="planta" class="ativo" title="Escolher no 3D mostra o lugar da peça na planta estrutural">planta</button>
      <button type="button" data-modo="elevacao" title="Escolher uma treliça no 3D mostra a elevação dela, como o projetista desenhou">elevação</button>
    </span>
    <button type="button" id="btn-trocar" class="so-ambos" title="Troca o 2D e o 3D de lado">⇄</button>
    <label class="com-2d" title="Qual desenho do projeto fica no 2D"><select id="desenho"></select></label>
  </div>
  <div class="menus" id="menus-unicos" aria-label="Menus do desenho 2D e do modelo 3D"></div>
  <div class="rapidos" id="rapidos-3d"></div>
  <div class="acoes">
    <button type="button" id="btn-paineis" title="Mostra ou esconde os painéis da direita (Propriedades, Camadas…) do 2D e do 3D — F4 em cada lado">Painéis</button>
    <button type="button" class="casa" onclick="location.href='/'" title="Voltar à lista de projetos">⌂</button>
  </div>
</header>

<main class="quadro" id="quadro">
  <div class="lado" id="lado-2d"><iframe id="f2d" title="Desenho 2D"></iframe></div>
  <div class="divisor" id="divisor" role="separator" aria-orientation="vertical" title="Arraste para mudar a largura; duplo clique divide ao meio"></div>
  <div class="lado" id="lado-3d"><iframe id="f3d" title="Modelo 3D"></iframe></div>
  <div class="aviso-dividida" id="aviso" hidden></div>
</main>

<script src="/barra_unica.js"></script>
<script src="/dividida.js"></script>
<script src="/versao.js" defer></script>
<script src="/vivo.js"></script>
</body>
</html>

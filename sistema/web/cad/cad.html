<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>if (window.parent !== window) document.documentElement.classList.add('embutida');</script>
<script src="/area.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b2e">
<script src="/tema-janela.js"></script>
<script src="/atualizacao.js" defer></script>
<title>Desenho 2D — Metálica</title>
<link rel="stylesheet" href="/editor3d/editor.css">
<link rel="stylesheet" href="/cad/cad.css">
<link rel="stylesheet" href="/cad/montagem.css">
<script>
(function () {
  var t = new URLSearchParams(location.search).get('tema');
  if (t !== 'claro' && t !== 'escuro') { try { t = localStorage.getItem('galpao.tema'); } catch (e) { t = null; } }
  if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t);
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%230b3d91'/><path d='M6 24h20M6 24V8M10 20l6-8 6 8' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/></svg>">
</head>
<body>

<header class="topo">
  <div class="marca">
    <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 24h20M6 24V8M10 20l6-8 6 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    <span>Desenho 2D</span>
  </div>
  <a class="voltar" id="btn-voltar" href="#" title="Volta para a tela anterior (o que foi desenhado já está gravado)">&larr; Voltar</a>
  <a class="voltar" id="link-projetos" href="/" title="Voltar à lista de projetos">Projetos</a>
  <a class="voltar" id="link-editor" href="/editor" title="Abrir o modelo 3D deste projeto">Modelo 3D</a>
  <a class="voltar" id="link-dividida" href="/dividida" hidden title="Este desenho e o modelo 3D lado a lado: escolher uma peça num mostra ela no outro">2D + 3D</a>

  <div class="menus" id="menus">
    <div class="menu" data-menu="desenho">
      <button type="button" class="menu-botao">Desenho</button>
      <div class="menu-lista">
        <button type="button" data-acao="abrir">Abrir desenho do projeto…</button>
        <div class="desenhos-salvos" id="desenhos-salvos"></div>
        <button type="button" data-acao="novo">Novo desenho em branco…</button>
        <button type="button" data-acao="projeto-2d" title="O projeto estrutural recebido em DXF ou PDF entra como o Original do projeto: só leitura, sem modelo 3D; depois, a Identificação para modelagem">Projeto recebido (DXF/PDF)…</button>
        <button type="button" data-acao="identificacao" title="Na Montagem: o programa procura a planta de locação (eixos e níveis), as tesouras e as terças no Original; você confere cada etapa e monta o 3D no fim">Identificação para modelagem</button>
        <button type="button" data-acao="importar-dxf" title="Pergunta o que é o arquivo: a planta do cliente (fundo da planta de lançamento), o projeto estrutural pronto (Montagem) ou só acrescentar a este desenho">Importar DXF ou PDF…</button>
        <button type="button" data-acao="excluir-desenhos" title="Manda desenhos do projeto (detalhamentos, cortes, pranchas) para a lixeira, para gerar de novo">Excluir desenhos…</button>
        <input type="file" id="arquivo-dxf" accept=".dxf,.pdf" hidden>
        <input type="file" id="arquivo-projeto-2d" accept=".dxf,.pdf" hidden>
        <hr>
        <button type="button" data-acao="pranchas" title="Folhas A0–A4 com moldura e carimbo; cada posição ou conjunto dos desenhos de detalhamento vira uma vista na escala do desenho">Montar pranchas…</button>
        <button type="button" data-acao="inserir-folha" title="Põe a folha com o carimbo neste desenho, na escala dele, para mover ou copiar os detalhes para dentro">Inserir folha (prancha)…</button>
        <button type="button" data-acao="pranchas-das-folhas" title="Cada folha posta neste desenho vira uma prancha em papel 1:1 com o que está dentro dela">Gerar pranchas das folhas</button>
        <button type="button" data-acao="salvar">Salvar <kbd>Ctrl+S</kbd></button>
        <hr>
        <button type="button" data-acao="exportar-dxf">Exportar DXF…</button>
        <button type="button" data-acao="exportar-pdf" title="Prancha no tamanho da folha; desenho comum no tamanho do desenho na sua escala">Exportar PDF (este desenho)</button>
        <button type="button" data-acao="pdf-pranchas" title="Um PDF com todas as pranchas do projeto, uma por página">PDF de todas as pranchas…</button>
        <button type="button" data-acao="dxf-pranchas" title="O DXF completo com todas as pranchas juntas num arquivo só, e um ZIP com uma prancha por arquivo (papel 1:1)">DXF de todas as pranchas…</button>
        <button type="button" data-acao="abrir-pasta">Abrir a pasta dos desenhos</button>
      </div>
    </div>
    <div class="menu" data-menu="lancamento">
      <button type="button" class="menu-botao">Lançamento</button>
      <div class="menu-lista">
        <button type="button" data-acao="arquitetonico" title="A planta do cliente (DXF ou PDF vetorial) vira a referência da Planta de lançamento: camadas ARQ em cinza e travadas, em milímetro real">Arquitetônico do cliente (DXF/PDF)…</button>
        <button type="button" data-acao="planta-lancamento">Abrir a planta de lançamento</button>
        <button type="button" data-acao="calibrar" title="Dois cliques numa medida conhecida do arquitetônico (uma cota, a largura de um vão) e a medida real: o arquitetônico é escalado">Calibrar escala do arquitetônico</button>
        <input type="file" id="arquivo-arquitetonico" accept=".dxf,.pdf,.dwg" hidden>
        <hr>
        <button type="button" data-acao="eixo" title="Lança os eixos um por vez: clique num eixo e o seguinte, paralelo, vai com o cursor (ou digite o vão: 6000, 3x6000); dois pontos no vazio fazem um eixo novo">Eixo (um por vez)</button>
        <button type="button" data-acao="malha" title="Linhas de eixo na camada EIXO, com as bolinhas e as cotas: vãos entre os pórticos (numerados) e entre as filas de pilares (letras)">Malha de eixos…</button>
        <button type="button" data-acao="gravar-eixos" title="Lê as linhas da camada EIXO deste desenho (duas direções perpendiculares, nomes nas bolinhas) e grava os eixos no projeto">Gravar eixos no projeto</button>
        <button type="button" data-acao="lancar-3d" title="Grava os eixos e abre o Modelo 3D com o diálogo Lançar estrutura">Lançar estrutura no 3D…</button>
        <hr>
        <a class="menu-link" href="/ligacoes" title="Biblioteca de ligações e acessórios: desenho, peças, verificação e os exemplos das obras">Ligações e acessórios…</a>
      </div>
    </div>
    <div class="menu" data-menu="estrutura">
      <button type="button" class="menu-botao">Estrutura</button>
      <div class="menu-lista">
        <button type="button" data-acao="estr-pilar" title="Um clique no centro (o cruzamento de eixos dá snap): seção de concreto ou perfil de aço, níveis da base e do topo, R gira 90°">Pilar</button>
        <button type="button" data-acao="estr-viga" title="Dois cliques, de pilar a pilar: seção de concreto ou perfil de aço, o nível da face de cima">Viga</button>
        <button type="button" data-acao="estr-fundacao" title="Um clique no centro: sapata ou bloco, lados, altura e o nível do topo">Fundação</button>
        <button type="button" data-acao="estr-tesoura" title="Pré-moldado: a viga de cobertura em I, do apoio de um pilar ao outro (duas águas ou uma água)">Tesoura de concreto</button>
        <button type="button" data-acao="estr-painel" title="Pré-moldado: placa de fechamento ao longo da parede (alveolar ou maciça, em pé ou deitada)">Placa de fechamento</button>
        <button type="button" data-acao="estr-laje" title="Pré-moldado: laje maciça, alveolar ou pré-laje, por dois cantos">Laje</button>
        <button type="button" data-acao="estr-escada" title="Pré-moldado: escada do pé ao topo, degraus pelos níveis">Escada</button>
        <button type="button" data-acao="estr-chapa" title="Metálica: chapa por dois cantos, com espessura e nível">Chapa</button>
        <button type="button" data-acao="estr-furo" title="Metálica: furo dentro da chapa">Furo</button>
        <button type="button" data-acao="estr-parafuso" title="Metálica: parafuso com diâmetro, comprimento e nível da cabeça">Parafuso</button>
        <button type="button" data-acao="estr-consolo" title="Clique no meio da face do pilar e depois para o lado de fora: comprimento, largura, altura e o nível do topo">Consolo</button>
        <hr>
        <button type="button" data-acao="estr-niveis" title="Os níveis do projeto (piso, boca do cálice, topo dos pilares…): as ferramentas oferecem nos campos de nível e o 3D desenha as linhas">Níveis…</button>
        <button type="button" data-acao="estr-trelica" title="Selecione a tesoura desenhada em linhas (banzos, diagonais, montantes) e lance-a de um eixo a outro, nos eixos que escolher; o 3D monta as barras">Tesoura de aço pelo desenho…</button>
        <button type="button" data-acao="estr-rotulos" title="Um rótulo por elemento, com a marca dele: os soltos (de elemento apagado) saem, os que faltam são criados">Arrumar os nomes dos elementos</button>
        <button type="button" data-acao="estr-renumerar" title="P1, P2… de cima para baixo e, na mesma fila, da esquerda para a direita (cada tipo à parte); o rótulo acompanha">Renumerar os elementos em ordem</button>
        <button type="button" data-acao="pm-configuracao" hidden title="A tela do galpão pré-moldado: geometria, cargas, vento, materiais, o cálculo, o memorial e as pranchas">Configuração do galpão pré-moldado…</button>
        <button type="button" data-acao="estr-do-3d" title="O que mudou no 3D volta para esta planta: as peças movidas movem o elemento, o pilar com outra seção troca o contorno, os níveis seguem o 3D e as peças lançadas no 3D (pilar, viga, sapata, consolo) entram como elementos novos. O que sumiu do 3D fica na planta e vira apontamento">Atualizar a planta pelo 3D</button>
        <button type="button" data-acao="estr-gerar-3d" title="Os elementos lançados nesta planta viram o modelo 3D do projeto (pilares e vigas de concreto extrudados entre os níveis, barras com perfil no aço, fundações e consolos) e o 3D abre para conferir">Gerar 3D da planta…</button>
      </div>
    </div>
    <div class="menu" data-menu="vistas">
      <button type="button" class="menu-botao">Vistas do modelo</button>
      <div class="menu-lista">
        <div class="menu-titulo">Inserir vista do modelo 3D</div>
        <button type="button" data-vista="frente">Frente</button>
        <button type="button" data-vista="tras">Trás</button>
        <button type="button" data-vista="esquerda">Lateral esquerda</button>
        <button type="button" data-vista="direita">Lateral direita</button>
        <button type="button" data-vista="topo">Planta (topo)</button>
        <button type="button" data-vista="inferior">Vista inferior</button>
        <hr>
        <button type="button" data-acao="corte">Corte por plano…</button>
        <button type="button" data-acao="estilos" title="Altura dos textos e cotas, terminador das cotas (seta, bola, traço) e padrão das hachuras — na seleção ou no desenho inteiro">Estilos do desenho…</button>
        <div class="menu-titulo">Para cortar numa tesoura: no Modelo 3D, ferramenta Seção (X), depois "Gerar desenho 2D"</div>
        <hr>
        <div class="menu-titulo">Detalhamento para produção</div>
        <button type="button" data-acao="peca-catalogo" title="Diz qual peça do catálogo (perfil, papel, aço) as linhas selecionadas representam — ou a camada inteira">Peça do catálogo…</button>
        <button type="button" data-acao="reconhecer" title="Projeto recebido (DXF/PDF importado): liga cada perfil escrito (U100x50#11, W 200x19,3, Ø1/2&quot;…) à linha que ele acompanha e põe as peças na camada PEÇAS RECONHECIDAS, para conferir antes de gerar o 3D">Reconhecer peças pelos perfis escritos…</button>
        <button type="button" data-acao="montar-planta" title="Projeto recebido sem 3D (DXF importado): cada linha com nome na planta estrutural (TESOURA 1, PAINEL 8…) recebe a treliça da elevação de mesmo nome, com o banzo inferior no nível; pilares da locação, terças, correntes e contraventos da planta das terças">Montar o 3D pela planta (projeto recebido)…</button>
        <button type="button" data-acao="folhas-recebidas" title="Projeto recebido: lê do DXF as folhas que o projetista montou (o espaço do papel) — número e título de cada folha, o carimbo, as considerações de cálculo (cargas e vento), as normas e os materiais — e grava no projeto">Ler folhas e considerações de cálculo do DXF…</button>
        <button type="button" data-acao="gerar-3d" title="Transforma este desenho em modelo 3D: cada linha com peça vira uma barra com perfil, aço, papel e marcas de posição e conjunto">Gerar modelo 3D do desenho…</button>
        <hr>
        <button type="button" data-acao="detalhar" title="Uma célula por posição (peças iguais contadas) e a elevação de cada conjunto, com cotas; gera os desenhos de detalhamento do projeto e o romaneio">Detalhar peças e conjuntos…</button>
        <button type="button" data-acao="atualizar-desenhos" title="Refaz agora os desenhos de detalhamento e as pranchas do projeto com o modelo 3D e o programa atuais (isso já acontece sozinho quando algo muda)">Atualizar desenhos e pranchas agora</button>
        <button type="button" data-acao="ver-3d" title="Abre o modelo 3D com as peças da posição ou do conjunto selecionado em destaque">Ver no 3D a peça selecionada</button>
        <button type="button" data-acao="ajustar-tamanho" title="Muda o comprimento e a altura do contorno da chapa selecionada (os furos ficam onde estão); depois use 'Aplicar ao modelo 3D'">Ajustar tamanho da chapa…</button>
        <button type="button" data-acao="aplicar-pecas" title="Elevação de conjunto (tesoura): as barras que você moveu, espelhou, copiou ou apagou nesta célula mudam igual no modelo 3D, em todas as tesouras desse tipo — o próximo Detalhar já sai com a correção">Aplicar peças da célula ao modelo 3D</button>
        <button type="button" data-acao="aplicar-furos" title="Chapa paramétrica (detalhe aberto pelo 3D, ou célula do detalhamento geral): os furos da camada FURO e o contorno deste desenho — movidos, apagados, desenhados ou redimensionados — vão para todas as chapas dessa posição no modelo 3D">Aplicar furos e tamanho ao modelo 3D</button>
        <button type="button" data-acao="materiais" title="Romaneio por posição, resumo por perfil com barras comerciais, chapas por espessura, conjuntos e acessórios; CSV para o Excel e PDF">Lista de materiais…</button>
      </div>
    </div>
    <div class="menu" data-menu="editar">
      <button type="button" class="menu-botao">Editar</button>
      <div class="menu-lista" id="menu-editar">
        <button type="button" data-acao="desfazer">Desfazer <kbd>Ctrl+Z</kbd></button>
        <button type="button" data-acao="refazer">Refazer <kbd>Ctrl+Y</kbd></button>
        <hr>
        <button type="button" data-acao="selecionar-tudo">Selecionar tudo <kbd>Ctrl+A</kbd></button>
        <button type="button" data-acao="apagar">Apagar seleção <kbd>Del</kbd></button>
        <hr>
        <button type="button" data-acao="selecionar-peca">Selecionar tudo da mesma peça</button>
      </div>
    </div>
    <div class="menu" data-menu="ver">
      <button type="button" class="menu-botao">Ver</button>
      <div class="menu-lista">
        <button type="button" data-acao="zoom-extensao">Zoom na extensão <kbd>Z</kbd></button>
        <button type="button" data-acao="zoom-selecao">Zoom na seleção</button>
        <hr>
        <button type="button" data-acao="grade">Grade ligada/desligada</button>
        <button type="button" data-acao="alternar-tema" title="O mesmo botão Tema do topo (que sai quando a barra não cabe)">Tema claro / escuro</button>
        <button type="button" data-acao="orto" title="Só horizontal e vertical ao desenhar e mover; Shift segurado trava na hora">Orto ligado/desligado <kbd>F8</kbd></button>
        <hr>
        <a class="menu-link" href="/ajuda" target="_blank" rel="noopener">Ajuda do programa…</a>
      </div>
    </div>
  </div>

  <div class="nome-modelo">
    <input id="nome-desenho" value="Desenho" spellcheck="false" aria-label="Nome do desenho">
  </div>

  <div class="topo-acoes">
    <label class="escala-topo" title="Escala em que o desenho será impresso: define o tamanho de textos, cotas e hachuras">Escala 1:
      <select id="escala"><option>1</option><option>2</option><option>2.5</option><option>5</option><option>10</option><option>20</option><option>25</option><option>50</option><option>100</option><option>200</option></select>
    </label>
    <button type="button" id="btn-salvar" class="botao" title="Salvar no projeto (também é gravado sozinho)">Salvar</button>
    <button type="button" id="btn-fechar" class="botao" title="Salva este desenho e volta para a tela anterior">Fechar e salvar</button>
    <button type="button" id="btn-dxf" class="botao destaque" title="Gerar o DXF para produção">Exportar DXF</button>
    <button type="button" id="btn-tema" class="botao" title="Alternar tema claro/escuro">Tema</button>
  </div>
</header>

<div class="area">
  <nav class="ferramentas" id="barra-ferramentas" aria-label="Ferramentas"></nav>

  <div class="palco" id="palco">
    <canvas id="canvas2d"></canvas>
    <div class="carimbo" id="carimbo">
      <span id="carimbo-contagem">0 objetos</span>
      <span id="carimbo-coord">x —  y —</span>
    </div>
    <div class="avisos" id="avisos" aria-live="polite"></div>
  </div>

  <nav class="ferramentas barra-disciplina" id="barra-disciplina" aria-label="Elementos da disciplina"></nav>

  <aside class="paineis" id="paineis" aria-label="Painéis">
    <section class="painel" data-painel="propriedades">
      <h2><button type="button" class="cabecalho">Propriedades</button></h2>
      <div class="corpo" id="painel-propriedades"></div>
    </section>
    <section class="painel" data-painel="camadas">
      <h2><button type="button" class="cabecalho">Camadas</button></h2>
      <div class="corpo" id="painel-camadas"></div>
    </section>
    <section class="painel" data-painel="snap">
      <h2><button type="button" class="cabecalho">Snap</button></h2>
      <div class="corpo" id="painel-snap"></div>
    </section>
    <section class="painel" data-painel="vistas">
      <h2><button type="button" class="cabecalho">Vistas no desenho</button></h2>
      <div class="corpo" id="painel-vistas"></div>
    </section>
  </aside>
</div>

<footer class="rodape">
  <span class="dica" id="dica">Carregando…</span>
  <span class="estado-salvo" id="estado-salvo"></span>
  <span class="estado-salvo" id="versao-programa" title="Versão do programa nesta janela"></span>
  <label class="medidas">MEDIDAS <input id="medida" spellcheck="false" autocomplete="off" placeholder="digite e Enter"></label>
</footer>

<dialog class="dialogo" id="dialogo">
  <form method="dialog">
    <h3 id="dialogo-titulo"></h3>
    <div class="dialogo-corpo" id="dialogo-corpo"></div>
    <div class="dialogo-botoes">
      <button type="button" id="dialogo-cancelar">Cancelar</button>
      <button type="submit" class="botao-ok" id="dialogo-ok">OK</button>
    </div>
  </form>
</dialog>

<script type="module" src="/cad/cad.js"></script>
<script type="module" src="/cad/montagem.js"></script>
<script src="/vivo.js"></script>
<script src="/versao.js" defer></script>
<script src="/lentidao.js" defer></script>
</body>
</html>

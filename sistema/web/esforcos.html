<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b2e">
<script src="/tema-janela.js"></script>
<script src="/atualizacao.js" defer></script>
<title>Esforços da estrutura — Metálica</title>
<link rel="stylesheet" href="/estilo.css">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('galpao.tema'); } catch (e) { t = null; }
  if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t);
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%230b3d91'/><path d='M6 26V12M16 26V6M26 26V16' stroke='%23fff' stroke-width='3' stroke-linecap='round'/></svg>">
<style>
  .esf { max-width: 1600px; margin: 0 auto; padding: 16px 22px 60px; }
  .linha2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .linha2 { grid-template-columns: 1fr; } }
  .caixa { background: var(--painel); border: 1px solid var(--borda); border-radius: var(--raio); padding: 12px 14px; box-shadow: var(--sombra); margin: 0 0 14px; }
  .caixa h3 { font-size: 13px; margin: 0 0 8px; color: var(--azul); text-transform: uppercase; letter-spacing: .04em; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .caixa h3 .acoes { margin-left: auto; display: flex; gap: 6px; text-transform: none; letter-spacing: 0; flex-wrap: wrap; }
  .caixa h3 .acoes button, .botao-p { font: inherit; font-size: 12px; padding: 3px 10px; border: 1px solid var(--borda); border-radius: var(--raio-p);
            background: var(--painel2); color: var(--texto); cursor: pointer; }
  .caixa h3 .acoes button.ativo { background: var(--azul); color: #fff; border-color: var(--azul); }
  .numeros { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 0 0 6px; }
  .numeros div { background: var(--painel2); border-radius: var(--raio-p); padding: 7px 9px; }
  .numeros b { display: block; font-size: 18px; color: var(--texto); font-variant-numeric: tabular-nums; }
  .numeros span { font-size: 11.5px; color: var(--texto2); }
  svg.planta { width: 100%; height: auto; max-height: 640px; display: block; background: var(--painel2); border-radius: var(--raio-p); }
  svg.planta .est { stroke: var(--texto3); stroke-width: 1; opacity: .55; vector-effect: non-scaling-stroke; }
  svg.planta circle.pil { stroke: var(--painel); stroke-width: 1.2; vector-effect: non-scaling-stroke; cursor: pointer; }
  svg.planta circle.pil.sel { stroke: var(--texto); stroke-width: 3; }
  svg.planta text { font-family: Arial, sans-serif; fill: var(--texto2); pointer-events: none; }
  .legenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--texto2); margin: 6px 2px 0; }
  .legenda i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; }
  table.tab { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.tab th, table.tab td { border: 1px solid var(--borda); padding: 4px 7px; text-align: left; vertical-align: top; }
  table.tab th { background: var(--painel2); font-weight: 600; color: var(--texto); cursor: pointer; white-space: nowrap; }
  table.tab th.ord::after { content: ' ▾'; color: var(--texto3); }
  table.tab td.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.tab tr.sel td { background: var(--azul-fraco); }
  table.tab tr { cursor: pointer; }
  table.tab .pt { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .campos { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; font-size: 13px; margin: 6px 0 8px; }
  .campos select, .campos input { font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--campo-borda); border-radius: var(--raio-p); background: var(--campo-fundo); color: var(--texto); }
  .mem { font-size: 12.5px; color: var(--texto2); line-height: 1.5; margin: 4px 0; }
  .mem b { color: var(--texto); }
  ul.lista { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--texto2); }
  ul.lista li { margin: 3px 0; }
  .vazio { color: var(--texto3); font-size: 13px; padding: 10px 0; }
  .filtro { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--texto2); cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .ocupado { opacity: .55; pointer-events: none; }
</style>
</head>
<body>

<header class="topo">
  <div class="marca">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 26V12M16 26V6M26 26V16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    <h1>Esforços da estrutura<span id="nome-projeto">projeto</span></h1>
  </div>
  <div class="acoes">
    <button type="button" id="btn-voltar" title="Volta para a tela anterior">&larr; Voltar</button>
    <button type="button" id="btn-3d" title="Abrir o modelo 3D do projeto">Modelo 3D</button>
    <button type="button" id="btn-tema" title="Alternar tema claro/escuro">Tema</button>
    <button type="button" onclick="location.href='/'" title="Voltar à lista de projetos">Projetos</button>
  </div>
</header>

<main class="esf" id="principal"><p class="vazio">Carregando os esforços…</p></main>

<script src="/esforcos.js"></script>
<script src="/versao.js" defer></script>
<script src="/etapas.js"></script>
<script src="/vivo.js"></script>
</body>
</html>

name: testes

# Só à mão (Actions → testes → Run workflow), desde 06/10: a cada push ela falhava (o ambiente do GitHub não tem o
# Python 3.14 nem as bibliotecas e os dados que os testes usam) e o GitHub mandava um e-mail por falha. A garantia é a
# conferência da noite no PC (testes/antes_de_publicar.py). Para voltar a rodar sozinha, acertar o ambiente antes.
on:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install pytest matplotlib ezdxf
      - name: Testes
        working-directory: sistema
        run: python -m pytest testes -q
